[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepgen"
version = "0.1.0"
dependencies = [
  "matplotlib",
  "scipy",
  "PyQt6",
  "numpy",
  "librosa",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = [ 
	"tests",
	"integration",
]
pythonpath = ["."]
#filterwarnings =
#    ignore::DeprecationWarning:librosa
#    ignore::DeprecationWarning:audioread


[project.scripts]
stepgen = "src.test_cli:main"
