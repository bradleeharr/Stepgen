[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stepgen"
version = "0.1.0"
dependencies = [
  "matplotlib",
  "scipy",
  "PyQt6",
  "numpy"
]
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]


[project.scripts]
stepgen = "src.test_cli:main"
